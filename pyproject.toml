[project]
name = "clinic-booking-assistant"
version = "2.2.0"
description = "AI receptionist for small clinics: web chat, WhatsApp and an admin dashboard."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kunduru Manikanta Reddy" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["static"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "S",             # bandit security checks
    "RUF",           # ruff-specific
    "PT",            # pytest style
    "C4",            # comprehensions
]
ignore = [
    "S101",    # assert is fine in tests (and forbidden in app code by review)
    "S311",    # random is only used for retry jitter
    "S608",    # SQL is built from fixed fragments with bound parameters
    "RUF001",  # Telugu text contains look-alike characters by design
    "RUF012",
    "PT018",   # compound asserts read fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"evals/**" = ["T201"]
"app/ai/messages.py" = ["E501"]  # user-facing sentences stay on one line

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.api.*"]
disallow_untyped_decorators = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "\\.\\.\\."]

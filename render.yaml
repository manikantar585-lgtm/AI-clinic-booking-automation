services:
  - type: web
    name: clinic-booking
    runtime: docker
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: ENV
        value: production
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CLINIC_NAME
        value: Sunrise Multi-Speciality Clinic
      - key: CLINIC_PHONE
        value: +91 90000 00000
      - key: LLM_API_KEY
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: REMINDER_SEND_HOUR
        value: "18"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a66">
<title>Book an Appointment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef4f2; --bg-grad: radial-gradient(1200px 600px at 10% -10%, #d7efe8 0%, transparent 60%), radial-gradient(900px 500px at 110% 10%, #e3ecfb 0%, transparent 55%);
    --surface: #ffffff; --surface-2: #f5f8f7; --ink: #10201c; --ink-2: #3d4f4a; --muted: #6f817c; --line: #e2eae7;
    --brand: #0b7a66; --brand-2: #10a385; --brand-soft: #e3f4ef; --brand-ink: #ffffff;
    --me: #0b7a66; --me-ink: #ffffff; --bot: #f1f5f4; --bot-ink: #10201c;
    --danger: #c2410c; --ok: #15803d; --shadow: 0 10px 30px -12px rgba(16, 32, 28, .18), 0 2px 6px rgba(16, 32, 28, .05);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1311; --bg-grad: radial-gradient(1200px 600px at 10% -10%, #0f2a24 0%, transparent 60%), radial-gradient(900px 500px at 110% 10%, #111b2e 0%, transparent 55%);
      --surface: #111c19; --surface-2: #16231f; --ink: #e8f1ee; --ink-2: #c1d0cb; --muted: #8aa09a; --line: #22332e;
      --brand: #2cc4a2; --brand-2: #3fd8b4; --brand-soft: #143a31; --brand-ink: #04211b;
      --me: #2cc4a2; --me-ink: #04211b; --bot: #1a2925; --bot-ink: #e8f1ee;
      --shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); background-image: var(--bg-grad); background-attachment: fixed; color: var(--ink);
    font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Telugu", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .app {
    max-width: 760px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column;
    padding: 0 16px; padding-bottom: env(safe-area-inset-bottom);
  }
  @media (min-width: 800px) { .app { padding: 20px 16px; } .shell { border-radius: 24px; box-shadow: var(--shadow); border: 1px solid var(--line); } }
  .shell { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--surface); overflow: hidden; margin: 0 -16px; }
  @media (min-width: 800px) { .shell { margin: 0; } }

  /* header */
  header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .logo { width: 44px; height: 44px; border-radius: 14px; flex: none; display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 6px 14px -6px var(--brand); }
  .title { flex: 1; min-width: 0; }
  .title h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; }
  .status .long { overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, .18); }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center;
    cursor: pointer; color: var(--ink-2); text-decoration: none; transition: background .15s, border-color .15s; }
  .icon-btn:hover { background: var(--surface-2); border-color: var(--brand); color: var(--brand); }

  /* log */
  #log { flex: 1; overflow-y: auto; padding: 20px 18px 8px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
  .row { display: flex; gap: 10px; align-items: flex-end; animation: rise .22s ease-out; }
  .row.me { flex-direction: row-reverse; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .avatar { width: 30px; height: 30px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
  .stack { display: flex; flex-direction: column; gap: 4px; max-width: min(82%, 520px); }
  .row.me .stack { align-items: flex-end; }
  .bubble { padding: 11px 14px; border-radius: var(--radius); white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot .bubble { background: var(--bot); color: var(--bot-ink); border-bottom-left-radius: 6px; }
  .me .bubble { background: var(--me); color: var(--me-ink); border-bottom-right-radius: 6px; }
  .bubble.error { background: #fff1eb; color: var(--danger); }
  @media (prefers-color-scheme: dark) { .bubble.error { background: #3a1c10; } }
  .time { font-size: 11px; color: var(--muted); padding: 0 4px; }

  .typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  /* welcome */
  .welcome { text-align: center; padding: 8px 4px 4px; }
  .welcome .hero { width: 64px; height: 64px; margin: 4px auto 12px; border-radius: 20px; display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 12px 24px -10px var(--brand); }
  .welcome h2 { margin: 0 0 4px; font-size: 21px; letter-spacing: -.02em; }
  .welcome p { margin: 0 auto 16px; color: var(--muted); max-width: 420px; }
  .actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; text-align: left; }
  @media (min-width: 560px) { .actions { grid-template-columns: repeat(4, 1fr); } }
  .action { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 8px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface);
    cursor: pointer; transition: transform .12s, border-color .15s, box-shadow .15s; }
  .action:hover { transform: translateY(-2px); border-color: var(--brand); box-shadow: var(--shadow); }
  .action .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
  .action b { font-size: 14px; } .action small { color: var(--muted); font-size: 12px; line-height: 1.35; }
  .section-label { margin: 18px 2px 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: left; }

  /* rich options */
  .opts { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 40px; animation: rise .22s ease-out; }
  .chip { border: 1px solid var(--brand); color: var(--brand); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s; }
  .chip:hover { background: var(--brand); color: var(--brand-ink); }
  .doctors { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; width: 100%; }
  .doc { display: flex; gap: 12px; align-items: center; padding: 12px; text-align: left; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .15s, transform .12s, box-shadow .15s; }
  .doc:hover { border-color: var(--brand); transform: translateY(-1px); box-shadow: var(--shadow); }
  .doc .ini { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--brand-soft); color: var(--brand); }
  .doc b { display: block; font-size: 14px; } .doc span { display: block; font-size: 12.5px; color: var(--muted); }
  .days { display: flex; gap: 8px; flex-wrap: wrap; }
  .day { width: 78px; padding: 10px 0; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: center; transition: all .15s; }
  .day:hover { border-color: var(--brand); background: var(--brand-soft); }
  .day small { display: block; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .day b { display: block; font-size: 22px; line-height: 1.2; } .day span { font-size: 12px; color: var(--ink-2); }
  .slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 420px; }
  .slot { padding: 10px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 13.5px; font-variant-numeric: tabular-nums; transition: all .15s; }
  .slot:hover { border-color: var(--brand); background: var(--brand); color: var(--brand-ink); }
  .confirm { display: flex; gap: 8px; }
  .btn { border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 600; cursor: pointer; transition: filter .15s, transform .1s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--brand); color: var(--brand-ink); } .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }

  /* ticket */
  .ticket { width: min(100%, 380px); border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); animation: rise .3s ease-out; }
  .ticket .top { padding: 16px; color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand-2)); }
  .ticket .top small { opacity: .85; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .ticket .code { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .ticket .code b { font-size: 24px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .ticket .code button { border: 1px solid rgba(255,255,255,.45); background: rgba(255,255,255,.15); color: #fff; border-radius: 10px; padding: 6px 10px; font-size: 12.5px; cursor: pointer; }
  .ticket dl { margin: 0; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; }
  .ticket dt { color: var(--muted); } .ticket dd { margin: 0; font-weight: 600; text-align: right; }
  .ticket .foot { display: flex; gap: 8px; padding: 0 16px 16px; }
  .ticket .foot .btn { flex: 1; font-size: 13px; padding: 9px 10px; }

  /* composer */
  .composer { padding: 10px 14px 12px; border-top: 1px solid var(--line); background: var(--surface); }
  form { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; padding: 6px 6px 6px 14px; transition: border-color .15s, box-shadow .15s; }
  form:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 15px; padding: 8px 0; outline: none; }
  input::placeholder { color: var(--muted); }
  .send { width: 42px; height: 42px; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; cursor: pointer; transition: filter .15s, opacity .15s; }
  .send:disabled { opacity: .45; cursor: default; }
  .fine { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 11.5px; padding: 8px 4px 0; }
  .fine a { color: var(--danger); font-weight: 600; text-decoration: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .alert { width: min(100%, 440px); border-radius: 18px; overflow: hidden; border: 1px solid #f3b8a6; background: #fff4f0; color: #5b1d0c; box-shadow: var(--shadow); animation: rise .25s ease-out; }
  .alert.calm { border-color: #c9c3f3; background: #f4f2ff; color: #2b2260; }
  @media (prefers-color-scheme: dark) { .alert { background: #3a1a10; border-color: #7a3420; color: #ffe1d6; } .alert.calm { background: #221d3d; border-color: #4a3f8a; color: #e6e1ff; } }
  .alert .ah { display: flex; gap: 10px; align-items: center; padding: 14px 16px 6px; font-weight: 700; font-size: 15px; }
  .alert .ai { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #d03b3b; color: #fff; flex: none; }
  .alert.calm .ai { background: #6250d6; }
  .alert p { margin: 0; padding: 0 16px 12px; white-space: pre-wrap; }
  .alert .acts { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 16px; }
  .alert .acts a { flex: 1 1 140px; text-align: center; text-decoration: none; padding: 11px 12px; border-radius: 12px; font-weight: 700; background: #d03b3b; color: #fff; }
  .alert.calm .acts a { background: #6250d6; }
  .alert .acts a.sec { background: transparent; color: inherit; border: 1px solid currentColor; font-weight: 600; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cross" viewBox="0 0 24 24"><path fill="currentColor" d="M10 3h4a1 1 0 0 1 1 1v5h5a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-5v5a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-5H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h5V4a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M9 9l6 6M15 9l-6 6M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/></symbol>
  <symbol id="i-steth" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 3v5a4 4 0 0 0 8 0V3M10 12v3a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 3l10 18H2L12 3zM12 10v5M12 18h.01"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.6-9 9-9 9z"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 12h13M13 7l5 5-5 5M20 5v14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
</svg>

<div class="app">
  <div class="shell">
    <header>
      <div class="logo"><svg width="22" height="22"><use href="#i-cross"/></svg></div>
      <div class="title">
        <h1 id="clinic">Clinic</h1>
        <div class="status"><span class="dot"></span><span class="long">Online · replies instantly</span></div>
      </div>
      <a class="icon-btn" id="call" href="#" title="Call the clinic" aria-label="Call the clinic"><svg width="18" height="18"><use href="#i-phone"/></svg></a>
      <button class="icon-btn" id="restart" type="button" title="Start a new conversation" aria-label="Start a new conversation"><svg width="18" height="18"><use href="#i-refresh"/></svg></button>
    </header>

    <main id="log" aria-live="polite" aria-label="Conversation"></main>

    <div class="composer">
      <form id="form" autocomplete="off">
        <label for="msg" class="sr">Message</label>
        <input id="msg" placeholder="Type in English or తెలుగు… e.g. Dentist tomorrow 11am" maxlength="1000">
        <button class="send" id="send" aria-label="Send" disabled><svg width="20" height="20"><use href="#i-send"/></svg></button>
      </form>
      <div class="fine">
        <span>Your number is only used for this appointment.</span>
        <span>Emergency? Call <a href="tel:108">108</a></span>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const log = $('#log'), input = $('#msg'), sendBtn = $('#send');
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
  del(k) { try { sessionStorage.removeItem(k); } catch {} },
};
let sid = store.get('sid') || newSid();
let doctors = [], clinic = { name: 'Clinic', phone: '' }, busy = false;
let transcript = JSON.parse(store.get('transcript') || '[]');

function newSid() { const s = 'w' + crypto.getRandomValues(new Uint32Array(2)).join('').slice(0, 14); store.set('sid', s); return s; }
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? n.className = v : k.startsWith('on') ? n[k] = v : n.setAttribute(k, v);
  for (const k of kids) if (k != null) n.append(k);
  return n;
}
function icon(id, size = 18) { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('width', size); s.setAttribute('height', size); const u = document.createElementNS('http://www.w3.org/2000/svg', 'use'); u.setAttribute('href', '#' + id); s.append(u); return s; }
function clock(ts) { return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function scroll() { requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; }); }
function toast(t) { const n = $('#toast'); n.textContent = t; n.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => n.classList.remove('show'), 1800); }
const fmt12 = hhmm => { const [h, m] = hhmm.split(':').map(Number); return `${(h % 12) || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const initials = name => name.replace(/^Dr\.?\s*/i, '').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();

// ---------------------------------------------------------------- rendering
function bubble(text, who, ts = Date.now(), cls = '') {
  const row = el('div', { class: 'row ' + who },
    who === 'bot' ? el('div', { class: 'avatar' }, icon('i-cross', 15)) : null,
    el('div', { class: 'stack' }, el('div', { class: 'bubble ' + cls }, text), el('div', { class: 'time' }, clock(ts))));
  log.append(row); scroll(); return row;
}

/** Strip lists from bot text when the same items are shown as buttons below it. */
function tidy(text, options) {
  if (!options?.length) return text;
  let t = text.split('\n')[0];
  if (options.every(o => /^\d{2}:\d{2}$/.test(o))) t = t.replace(/:\s*[\d:,\s]+(?=\.)/, '');
  if (options.every(o => /^\d{4}-\d{2}-\d{2}$/.test(o))) t = t.replace(/\s*(Next open days|ఖాళీ రోజులు):[^.]*\./, '');
  return t;
}

function optionsView(options) {
  if (!options?.length) return null;
  const box = el('div', { class: 'opts' });
  const pick = (value, label) => () => send(value, label);
  if (options.every(o => /^\d+\.\s/.test(o))) {
    const grid = el('div', { class: 'doctors' });
    options.forEach(o => {
      const n = parseInt(o, 10), d = doctors[n - 1];
      grid.append(el('button', { class: 'doc', type: 'button', onclick: pick(String(n), d ? d.name : o) },
        el('div', { class: 'ini' }, d ? initials(d.name) : n),
        el('div', {}, el('b', {}, d ? d.name : o.replace(/^\d+\.\s/, '')), el('span', {}, d ? `${d.specialty} · ₹${d.fee}` : ''))));
    });
    box.append(grid);
  } else if (options.every(o => /^\d{4}-\d{2}-\d{2}$/.test(o))) {
    const row = el('div', { class: 'days' });
    options.forEach(o => { const d = parseISO(o);
      row.append(el('button', { class: 'day', type: 'button', onclick: pick(o, d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' })) },
        el('small', {}, d.toLocaleDateString([], { weekday: 'short' })), el('b', {}, d.getDate()), el('span', {}, d.toLocaleDateString([], { month: 'short' }))));
    });
    box.append(row);
  } else if (options.every(o => /^\d{2}:\d{2}$/.test(o))) {
    const grid = el('div', { class: 'slots' });
    options.forEach(o => grid.append(el('button', { class: 'slot', type: 'button', onclick: pick(o, fmt12(o)) }, fmt12(o))));
    box.append(grid);
  } else if (options.length === 2 && /^yes$/i.test(options[0]) && /^no$/i.test(options[1])) {
    box.append(el('div', { class: 'confirm' },
      el('button', { class: 'btn primary', type: 'button', onclick: pick('yes', 'Yes, book it') }, icon('i-check', 16), ' Yes, book it'),
      el('button', { class: 'btn ghost', type: 'button', onclick: pick('no', 'No') }, 'No, change')));
  } else {
    options.forEach(o => box.append(el('button', { class: 'chip', type: 'button', onclick: pick(o, o) }, o)));
  }
  return box;
}

function setOptions(options) {
  log.querySelectorAll('.opts').forEach(n => n.remove());
  const v = optionsView(options); if (v) { log.append(v); scroll(); }
}

function icsFor(a) {
  const d = a.date.replaceAll('-', ''), [h, m] = a.time.split(':');
  const end = new Date(parseISO(a.date).setHours(+h, +m + 30));
  const p = n => String(n).padStart(2, '0');
  const endStr = `${end.getFullYear()}${p(end.getMonth() + 1)}${p(end.getDate())}T${p(end.getHours())}${p(end.getMinutes())}00`;
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//clinic//booking//EN', 'BEGIN:VEVENT', `UID:${a.code}@clinic`,
    `DTSTART:${d}T${h}${m}00`, `DTEND:${endStr}`, `SUMMARY:${a.doctor_name} (${a.specialty})`,
    `DESCRIPTION:Booking code ${a.code} at ${clinic.name}. Please arrive 10 minutes early.`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}

function ticket(a) {
  const when = parseISO(a.date).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
  const copy = el('button', { type: 'button', onclick: () => navigator.clipboard?.writeText(a.code).then(() => toast('Booking code copied')) }, 'Copy');
  const cal = el('button', { class: 'btn ghost', type: 'button', onclick: () => {
    const url = URL.createObjectURL(new Blob([icsFor(a)], { type: 'text/calendar' }));
    el('a', { href: url, download: `appointment-${a.code}.ics` }).click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  } }, icon('i-cal', 15), ' Add to calendar');
  const card = el('div', { class: 'ticket' },
    el('div', { class: 'top' }, el('small', {}, icon('i-check', 14), a.rescheduled_count ? 'Appointment rescheduled' : 'Appointment confirmed'),
      el('div', { class: 'code' }, el('b', {}, a.code), copy)),
    el('dl', {},
      el('dt', {}, 'Doctor'), el('dd', {}, a.doctor_name), el('dt', {}, 'Specialty'), el('dd', {}, a.specialty),
      el('dt', {}, 'Date'), el('dd', {}, when), el('dt', {}, 'Time'), el('dd', {}, fmt12(a.time)),
      el('dt', {}, 'Patient'), el('dd', {}, a.patient_name), el('dt', {}, 'Fee'), el('dd', {}, '₹' + a.fee)),
    el('div', { class: 'foot' }, cal));
  log.append(el('div', { class: 'row bot' }, el('div', { class: 'avatar' }, icon('i-check', 15)), card)); scroll();
}

function alertCard(kind, text) {
  const calm = kind === 'self_harm';
  const tel = n => 'tel:' + n.replace(/\s/g, '');
  const acts = calm
    ? [el('a', { href: 'tel:14416' }, 'Call Tele-MANAS 14416'), el('a', { class: 'sec', href: 'tel:108' }, 'Emergency 108')]
    : [el('a', { href: 'tel:108' }, 'Call 108 ambulance'), clinic.phone ? el('a', { class: 'sec', href: tel(clinic.phone) }, 'Call the clinic') : null];
  log.append(el('div', { class: 'row bot' }, el('div', { class: 'avatar' }, icon(calm ? 'i-heart' : 'i-alert', 15)),
    el('div', { class: 'alert' + (calm ? ' calm' : ''), role: 'alert' },
      el('div', { class: 'ah' }, el('div', { class: 'ai' }, icon(calm ? 'i-heart' : 'i-alert', 18)), calm ? "You're not alone" : 'This may be an emergency'),
      el('p', {}, text.replace(/^⚠️\s*/, '')), el('div', { class: 'acts' }, ...acts))));
  scroll();
}

function welcome() {
  const act = (ic, title, sub, msg) => el('button', { class: 'action', type: 'button', onclick: () => send(msg, title) },
    el('div', { class: 'ic' }, icon(ic)), el('b', {}, title), el('small', {}, sub));
  const docs = el('div', { class: 'doctors' });
  doctors.forEach(d => docs.append(el('button', { class: 'doc', type: 'button', onclick: () => send(`book ${d.name}`, `Book with ${d.name}`) },
    el('div', { class: 'ini' }, initials(d.name)), el('div', {}, el('b', {}, d.name), el('span', {}, `${d.specialty} · ₹${d.fee}`)))));
  log.append(el('section', { class: 'welcome', id: 'welcome' },
    el('div', { class: 'hero' }, icon('i-steth', 30)),
    el('h2', {}, 'Hi! How can we help today?'),
    el('p', {}, `Book, check or cancel your visit to ${clinic.name} in seconds. Just tell me what you need, in English or తెలుగు.`),
    el('div', { class: 'actions' },
      act('i-cal', 'Book a visit', 'Pick a doctor, day and time', 'Book appointment'),
      act('i-move', 'Reschedule', 'Move to another time', 'Reschedule'),
      act('i-list', 'My bookings', 'See upcoming visits', 'My bookings'),
      act('i-x', 'Cancel', 'Cancel with your code', 'Cancel')),
    doctors.length ? el('div', { class: 'section-label' }, 'Book directly with a doctor') : null,
    doctors.length ? docs : null));
}

function typing() {
  return log.appendChild(el('div', { class: 'row bot' }, el('div', { class: 'avatar' }, icon('i-cross', 15)),
    el('div', { class: 'bubble typing', 'aria-label': 'Assistant is typing' }, el('span'), el('span'), el('span'))));
}

// ---------------------------------------------------------------- state
function save() { store.set('transcript', JSON.stringify(transcript.slice(-60))); }
function replay() {
  for (const m of transcript) {
    if (m.who === 'me') bubble(m.text, 'me', m.ts);
    else if (m.alert) alertCard(m.alert, m.text);
    else { bubble(m.text, 'bot', m.ts, m.error ? 'error' : ''); if (m.appointment) ticket(m.appointment); }
  }
  const last = transcript[transcript.length - 1];
  if (last?.who === 'bot') setOptions(last.options);
}

async function send(value, label = value) {
  if (busy || !value.trim()) return;
  busy = true; sendBtn.disabled = true;
  $('#welcome')?.remove();
  setOptions([]);
  const ts = Date.now();
  bubble(label, 'me', ts); transcript.push({ who: 'me', text: label, ts });
  const dots = typing(); scroll();
  let entry;
  try {
    const [r] = await Promise.all([
      fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sid, message: value }) }),
      new Promise(res => setTimeout(res, 350)), // a short beat reads as "thinking", not lag
    ]);
    const j = await r.json();
    const moved = j.appointment?.rescheduled_count > 0;
    const text = j.appointment && !/[ఀ-౿]/.test(j.text)
      ? (moved ? 'Done! Your appointment has been moved. Same code as before.' : "You're all set! Here are your booking details. Keep the code: you'll need it to check or cancel.")
      : tidy(j.text, j.options);
    entry = r.ok ? { who: 'bot', text, options: j.options, appointment: j.appointment, alert: j.alert, ts: Date.now() }
                 : { who: 'bot', text: j.error?.message || 'Sorry, something went wrong. Please try again.', error: true, ts: Date.now() };
  } catch {
    entry = { who: 'bot', text: "I couldn't reach the clinic. Please check your connection and try again.", error: true, ts: Date.now() };
  }
  dots.remove();
  if (entry.alert) alertCard(entry.alert, entry.text);
  else bubble(entry.text, 'bot', entry.ts, entry.error ? 'error' : '');
  if (entry.appointment) ticket(entry.appointment);
  setOptions(entry.options);
  transcript.push(entry); save();
  busy = false; sendBtn.disabled = !input.value.trim(); input.focus();
}

$('#form').onsubmit = e => { e.preventDefault(); const v = input.value.trim(); if (v) { input.value = ''; sendBtn.disabled = true; send(v); } };
input.oninput = () => { sendBtn.disabled = busy || !input.value.trim(); };
$('#restart').onclick = () => {
  if (transcript.length && !confirm('Start a new conversation?')) return;
  transcript = []; store.del('transcript'); sid = newSid(); log.textContent = ''; welcome(); input.focus();
};

(async function init() {
  try {
    const [c, d] = await Promise.all([fetch('/api/clinic').then(r => r.json()), fetch('/api/doctors').then(r => r.json())]);
    clinic = c; doctors = d;
  } catch {}
  $('#clinic').textContent = clinic.name; document.title = `Book an appointment · ${clinic.name}`;
  if (clinic.phone) $('#call').href = 'tel:' + clinic.phone.replace(/\s/g, ''); else $('#call').hidden = true;
  transcript.length ? replay() : welcome();
  if (matchMedia('(max-width: 480px)').matches) input.placeholder = 'Type a message… (English / తెలుగు)';
  input.focus();
})();
</script>

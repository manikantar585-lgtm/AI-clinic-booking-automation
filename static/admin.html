<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Admin</title>
<style>
  :root { --bg:#f4f7f6; --card:#fff; --ink:#1d2a2a; --muted:#6b7b7b; --brand:#0f8a73; --brand-ink:#fff; --line:#e3e9e8; --warn:#b4562b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1514; --card:#18211f; --ink:#e7efed; --muted:#93a5a2; --brand:#2bb89a; --brand-ink:#06201a; --line:#25312f; --warn:#e08a5f; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 14px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  input, select, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  button.p { background:var(--brand); color:var(--brand-ink); border:0; font-weight:600; cursor:pointer; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:14px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .stat b { display:block; font-size:22px; font-variant-numeric:tabular-nums; } .stat span { color:var(--muted); font-size:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:720px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  td button { padding:4px 8px; font-size:12px; cursor:pointer; }
  .st { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); }
  .st.booked { color:var(--brand); border-color:var(--brand); } .st.no_show, .st.cancelled { color:var(--warn); border-color:var(--warn); }
  .empty { padding:24px; text-align:center; color:var(--muted); }
  #err { color:var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Clinic Admin</h1>
  <div class="bar">
    <input id="tok" type="password" placeholder="Admin token">
    <input id="day" type="date">
    <select id="status"><option value="">All statuses</option><option>booked</option><option>completed</option><option>cancelled</option><option value="no_show">no show</option></select>
    <button class="p" id="load">Load</button>
    <button id="rem">Copy reminders</button>
    <span id="err"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="card"><table><thead><tr><th>Time</th><th>Code</th><th>Patient</th><th>Phone</th><th>Doctor</th><th>Reason</th><th>Source</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script>
const $ = id => document.getElementById(id);
try { $('tok').value = localStorage.getItem('adminTok') || ''; } catch (e) {}
$('day').value = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type':'application/json', 'X-Admin-Token': $('tok').value, ...(opts.headers||{}) } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
function cell(text) { const td = document.createElement('td'); td.textContent = text ?? ''; return td; }

async function load() {
  $('err').textContent = '';
  try { localStorage.setItem('adminTok', $('tok').value); } catch (e) {}
  try {
    const s = await api('/api/admin/stats');
    const labels = { today_booked:'Booked today', upcoming:'Upcoming', completed:'Completed', cancelled:'Cancelled', no_show:'No-shows', revenue_completed:'Revenue (Rs)' };
    $('stats').innerHTML = '';
    for (const [k, l] of Object.entries(labels)) { const d = document.createElement('div'); d.className = 'stat'; d.innerHTML = '<b></b><span></span>'; d.querySelector('b').textContent = s[k].toLocaleString('en-IN'); d.querySelector('span').textContent = l; $('stats').appendChild(d); }
    const q = new URLSearchParams(); if ($('day').value) q.set('date', $('day').value); if ($('status').value) q.set('status', $('status').value);
    const rows = await api('/api/admin/appointments?' + q);
    const tb = $('rows'); tb.innerHTML = '';
    if (!rows.length) { tb.innerHTML = '<tr><td colspan="9" class="empty">No appointments</td></tr>'; return; }
    for (const a of rows) {
      const tr = document.createElement('tr');
      [a.date + ' ' + a.time, a.code, a.patient_name, a.patient_phone, a.doctor_name, a.reason, a.source].forEach(v => tr.appendChild(cell(v)));
      const st = cell(''); const b = document.createElement('span'); b.className = 'st ' + a.status; b.textContent = a.status.replace('_',' '); st.appendChild(b); tr.appendChild(st);
      const act = cell('');
      if (a.status === 'booked') for (const [s, l] of [['completed','Done'], ['no_show','No-show'], ['cancelled','Cancel']]) {
        const btn = document.createElement('button'); btn.textContent = l;
        btn.onclick = async () => { try { await api(`/api/admin/appointments/${a.code}/status`, { method:'POST', body: JSON.stringify({ status: s }) }); load(); } catch (e) { $('err').textContent = e.message; } };
        act.appendChild(btn);
      }
      tr.appendChild(act); tb.appendChild(tr);
    }
  } catch (e) { $('err').textContent = e.message; }
}
$('load').onclick = load;
$('rem').onclick = async () => {
  try {
    const list = await api('/api/admin/reminders?date=' + $('day').value);
    const text = list.map(r => `${r.patient_phone}: ${r.message}`).join('\n\n') || 'No bookings that day.';
    await navigator.clipboard.writeText(text).catch(() => {});
    $('err').textContent = list.length + ' reminder(s) copied';
  } catch (e) { $('err').textContent = e.message; }
};
if ($('tok').value) load();
</script>
</body>
</html>

name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · types · tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check app tests evals
      - name: Ruff format
        run: ruff format --check app tests evals
      - name: Mypy (strict)
        run: mypy
      - name: Tests + coverage
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: NLU eval (rules)
        run: python -m evals.run --min-accuracy 0.95 --show-failures
      - name: Safety eval (red-flag detection must catch 100%)
        run: python -m evals.run --suite safety --min-accuracy 1.0 --show-failures

  postgres:
    name: Tests on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Full test suite against Postgres
        run: pytest -q --junitxml=pg-results.xml || (python .github/scripts/junit_annotations.py pg-results.xml; exit 1)

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clinic-bot .
      - name: Start container and hit /ready
        run: |
          docker run -d --name bot -p 8000:8000 -e ADMIN_TOKEN=ci-token clinic-bot
          for i in $(seq 1 30); do curl -fsS localhost:8000/ready && exit 0; sleep 1; done
          docker logs bot; exit 1

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an Appointment</title>
<style>
  :root { --bg:#f4f7f6; --card:#fff; --ink:#1d2a2a; --muted:#6b7b7b; --brand:#0f8a73; --brand-ink:#fff; --me:#dff3ee; --line:#e3e9e8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1514; --card:#18211f; --ink:#e7efed; --muted:#93a5a2; --brand:#2bb89a; --brand-ink:#06201a; --me:#1f3a33; --line:#25312f; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:560px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; padding:12px 16px; }
  header { display:flex; align-items:center; gap:10px; padding:8px 0 12px; }
  .logo { width:38px; height:38px; border-radius:10px; background:var(--brand); color:var(--brand-ink); display:grid; place-items:center; font-weight:700; }
  header h1 { font-size:16px; margin:0; } header p { margin:0; color:var(--muted); font-size:13px; }
  #log { flex:1; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:9px 12px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:var(--bg); align-self:flex-start; border-top-left-radius:4px; }
  .me { background:var(--me); align-self:flex-end; border-top-right-radius:4px; }
  .opts { display:flex; flex-wrap:wrap; gap:6px; align-self:flex-start; }
  .opts button { border:1px solid var(--brand); color:var(--brand); background:transparent; border-radius:999px; padding:5px 11px; font:inherit; font-size:13px; cursor:pointer; }
  .opts button:hover { background:var(--brand); color:var(--brand-ink); }
  form { display:flex; gap:8px; padding-top:10px; }
  input { flex:1; min-width:0; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; }
  form button { padding:0 16px; border:0; border-radius:10px; background:var(--brand); color:var(--brand-ink); font:inherit; font-weight:600; cursor:pointer; }
  .hint { color:var(--muted); font-size:12px; text-align:center; padding-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">+</div>
    <div><h1 id="clinic">Clinic</h1><p>Book in English or తెలుగు · 24x7</p></div>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="f"><input id="m" placeholder="e.g. Dentist tomorrow at 11am" autocomplete="off"><button>Send</button></form>
  <div class="hint">Your number is only used for this appointment.</div>
</div>
<script>
const log = document.getElementById('log');
let sid;
try { sid = localStorage.getItem('sid'); } catch (e) {}
if (!sid) { sid = 'w' + Math.random().toString(36).slice(2, 12); try { localStorage.setItem('sid', sid); } catch (e) {} }

function add(text, who) {
  const d = document.createElement('div'); d.className = 'msg ' + who; d.textContent = text; log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
function options(list) {
  document.querySelectorAll('.opts').forEach(o => o.remove());
  if (!list || !list.length) return;
  const box = document.createElement('div'); box.className = 'opts';
  list.forEach(o => { const b = document.createElement('button'); b.type = 'button'; b.textContent = o; b.onclick = () => send(o); box.appendChild(b); });
  log.appendChild(box); log.scrollTop = log.scrollHeight;
}
async function send(text) {
  add(text, 'me'); options([]);
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ session_id: sid, message: text }) });
    const j = await r.json();
    add(j.text || 'Sorry, something went wrong.', 'bot'); options(j.options);
  } catch (e) { add('Network problem. Please try again.', 'bot'); }
}
document.getElementById('f').onsubmit = e => { e.preventDefault(); const i = document.getElementById('m'); const v = i.value.trim(); if (v) { i.value = ''; send(v); } };
fetch('/api/clinic').then(r => r.json()).then(c => { document.getElementById('clinic').textContent = c.name; document.title = c.name; });
add('Hi! I can book, cancel or check your appointment. Tell me what you need.', 'bot');
options(['Book appointment', 'My bookings', 'Cancel', 'Doctors']);
</script>
</body>
</html>
